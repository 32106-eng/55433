name: Build from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Unzip source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one source ZIP in the repository root; found ${#archives[@]}."
            exit 1
          fi

          # Accept both the outer GG-main ZIP and the inner source ZIP.
          unzip -q "${archives[0]}" -d unpacked
          source_archive=$(find unpacked -type f -iname '*source*.zip' -print -quit)
          if [[ -n "$source_archive" ]]; then
            unzip -q "$source_archive" -d unpacked/source
          fi

          gradlew_path=$(find unpacked -type f -name gradlew -print -quit)
          if [[ -z "$gradlew_path" ]]; then
            echo "Could not find the Gradle project after extracting the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$gradlew_path")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: GG-TRex-mod
          path: '**/build/libs/*.jar'
